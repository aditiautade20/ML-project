# Render Blueprint for InvoiceIQ
# https://render.com/docs/blueprint-spec
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI + Python)
  # ============================================================================
  - type: web
    name: invoiceiq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        value: sqlite:///./data/invoiceiq.db
      - key: ALLOWED_ORIGINS
        value: "*"

  # ============================================================================
  # 2. Frontend Static Site (React 18 + Vite)
  # ============================================================================
  - type: web
    name: invoiceiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: invoiceiq-backend
          property: host
